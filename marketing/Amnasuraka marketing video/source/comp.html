<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<script>if (/layout=wide/.test(location.search)) document.documentElement.classList.add("wide");</script>
<title>Amnasuraka marketing video</title>
<style>
@font-face { font-family: "Kurdish"; src: url("assets/kurdish.otf") format("truetype"); }
* { box-sizing: border-box; transition: none !important; animation: none !important; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0e0304; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Kurdish", "Segoe UI Symbol", sans-serif; color: #fff; }
.abs { position: absolute; }
.latin { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

/* ---------- background */
#bg { position: absolute; inset: 0; background: radial-gradient(130% 70% at 50% -5%, #6b0c12 0%, #33070a 42%, #120405 78%, #0b0203 100%); }
#bgGlow { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; background: radial-gradient(closest-side, rgba(204,12,12,0.28), rgba(204,12,12,0)); }
.sculpt { position: absolute; filter: grayscale(1) brightness(1.6) contrast(0.9); opacity: 0.07; }
#grain { position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: overlay; }
#vignette { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }

/* ---------- phone */
#phone { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; }
#bezel { position: absolute; inset: -13px; border-radius: 60px; background: linear-gradient(150deg, #34343a 0%, #0d0d0f 30%, #151518 70%, #2c2c31 100%);
  box-shadow: inset 0 0 0 1.5px #4a4a52, inset 0 0 0 5px #0a0a0b, 0 50px 110px rgba(0,0,0,0.6), 0 0 160px rgba(204,12,12,0.22); }
.sidebtn { position: absolute; width: 4px; border-radius: 2px; background: #2a2a2f; }
#screen { position: absolute; inset: 0; border-radius: 47px; overflow: hidden; background: #fafaf7; }
#sbar { position: absolute; left: 0; top: 0; width: 390px; height: 44px; direction: ltr; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0 30px; font: 600 15px "Segoe UI", Arial, sans-serif; z-index: 5; }
#punch { position: absolute; left: 189px; top: 13px; width: 13px; height: 13px; border-radius: 50%; background: #050506; box-shadow: 0 0 0 2px rgba(255,255,255,0.05); z-index: 6; }
#vp { position: absolute; left: 0; top: 44px; width: 390px; height: 800px; overflow: hidden; background: #fafaf7; }
.layer { position: absolute; inset: 0; }
.layer img { position: absolute; left: 0; width: 390px; height: 800px; }
.layer .mid { position: absolute; left: 0; width: 390px; overflow: hidden; }
#ovl { position: absolute; inset: 0; pointer-events: none; }
.tap { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(133,11,16,0.18); border: 3px solid rgba(133,11,16,0.9); box-shadow: 0 0 0 3px rgba(255,255,255,0.75); }
#spot { position: absolute; border-radius: 10px; border: 3px solid #f2c14e; box-shadow: 0 0 0 9999px rgba(10,4,4,0.5), 0 0 24px rgba(242,193,78,0.7); }

/* select dialog (native picker stand-in) */
#picker { position: absolute; inset: 0; background: rgba(0,0,0,0.42); display: flex; align-items: center; justify-content: center; }
#picker .card { width: 300px; background: #fff; border-radius: 18px; padding: 10px 0; box-shadow: 0 20px 60px rgba(0,0,0,0.35); color: #1c1b19; }
#picker .row { display: flex; align-items: center; justify-content: space-between; height: 50px; padding: 0 22px; font-size: 15px; }
#picker .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #8a8580; display: flex; align-items: center; justify-content: center; }
#picker .row.sel .radio { border-color: #850B10; }
#picker .row.sel .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #850B10; }
#picker .row.hl { background: rgba(133,11,16,0.08); }

/* ---------- face scan overlay (mirrors FaceScanCapture.tsx) */
#fs { position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff; }
#fsTitle { position: absolute; left: 64px; right: 64px; top: 22.4px; text-align: center; font-size: 11.34px; color: rgba(255,255,255,0.7); letter-spacing: 0.025em; }
#fsClose { position: absolute; left: 16px; top: 16px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
#ring { position: absolute; left: 61px; top: 180px; width: 268px; height: 268px; }
#brackets { position: absolute; inset: -6px; }
#brackets span { position: absolute; width: 28px; height: 28px; }
#outer { position: absolute; inset: 0; border-radius: 50%; border-width: 2px; }
#conic { position: absolute; inset: 5px; border-radius: 50%; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); }
#view { position: absolute; inset: 11px; border-radius: 50%; overflow: hidden; background: #171717; }
#feed { position: absolute; inset: 0; }
#feed svg { display: block; width: 246px; height: 246px; }
#loader { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; }
#scanline { position: absolute; left: 24px; right: 24px; height: 2px; border-radius: 2px; background: linear-gradient(to right, transparent, #850B10, transparent); box-shadow: 0 0 12px #850B10; }
#prog { position: absolute; inset: 0; }
#flash { position: absolute; inset: 0; background: #fff; }
#okBadge { position: absolute; bottom: 16px; left: 50%; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: #10b981; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px rgba(0,0,0,0.25), 0 10px 15px rgba(0,0,0,0.3); }
#foundBadge { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); white-space: nowrap; border-radius: 999px; background: #10b981; padding: 4px 12px; font-size: 11px; color: #fff; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }
#fsText { position: absolute; left: 35px; width: 320px; top: 484px; min-height: 136px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; line-height: 1.6; }
.fsSm { font-size: 12.94px; }
.fsXs { font-size: 11.34px; }
.fsLg { font-size: 16.37px; }
#fsBar { margin-top: 8px; width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.15); overflow: hidden; }
#fsBar div { height: 100%; border-radius: 4px; background: #10b981; }
#fsBtns { margin-top: 16px; display: flex; gap: 12px; justify-content: center; }
.fsBtn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 12px 20px; font-size: 12.94px; line-height: 1.2; }

/* ---------- captions */
#capShade { position: absolute; left: 0; right: 0; top: 0; height: 600px; background: linear-gradient(to bottom, rgba(14,3,4,0.97) 0%, rgba(14,3,4,0.9) 62%, rgba(14,3,4,0) 100%); }
.cue { position: absolute; left: 60px; right: 60px; text-align: center; }
.chip { display: inline-flex; align-items: center; gap: 12px; padding: 10px 30px 12px; border-radius: 999px; background: #850B10; color: #fff; font-size: 34px; line-height: 1.3; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.18), 0 10px 30px rgba(133,11,16,0.55); }
.chip.num { width: 70px; height: 70px; padding: 0 0 4px; justify-content: center; border-radius: 50%; font-size: 40px; }
.title { margin-top: 22px; font-size: 84px; line-height: 1.28; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,0.5); }
.sub { margin-top: 14px; font-size: 42px; line-height: 1.55; color: #F4ECE7; }
.sub b { color: #f2c14e; font-weight: normal; }

/* booking stepper */
#stepper { position: absolute; left: 110px; width: 860px; top: 58px; height: 140px; }
#stLine, #stFill { position: absolute; top: 34px; height: 4px; border-radius: 4px; }
#stLine { left: 36px; right: 36px; background: #5E3A39; }
#stFill { right: 36px; background: #cc1a22; box-shadow: 0 0 16px rgba(204,26,34,0.6); }
.stNode { position: absolute; top: 0; width: 72px; display: flex; flex-direction: column; align-items: center; }
.stDot { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; border: 3px solid #8C6A66; background: #2A0D0E; color: #FFFFFF; }
.stLbl { margin-top: 12px; font-size: 32px; white-space: nowrap; color: #FFFFFF; }

/* privacy pill */
#privacy { position: absolute; left: 70px; right: 70px; bottom: 58px; display: flex; align-items: center; gap: 22px; padding: 22px 30px; border-radius: 28px; background: rgba(16,24,20,0.82); border: 1.5px solid rgba(16,185,129,0.55); box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(16,185,129,0.18); }
#privacy .ic { flex: none; width: 76px; height: 76px; border-radius: 22px; background: rgba(16,185,129,0.16); display: flex; align-items: center; justify-content: center; }
#privacy .tx1 { font-size: 36px; line-height: 1.4; color: #fff; }
#privacy .tx2 { font-size: 30px; line-height: 1.4; color: #F4ECE7; }
#botShade { position: absolute; left: 0; right: 0; bottom: 0; height: 380px; background: linear-gradient(to top, rgba(14,3,4,0.92), rgba(14,3,4,0)); }

/* full-screen cards */
#intro, #outro, #dive { position: absolute; inset: 0; }
.bigTitle { position: absolute; left: 60px; right: 60px; text-align: center; font-size: 92px; line-height: 1.3; text-shadow: 0 6px 40px rgba(0,0,0,0.6); }
.midTitle { position: absolute; left: 60px; right: 60px; text-align: center; font-size: 50px; line-height: 1.5; color: #F4ECE7; }
.gold { color: #E8C77A; }
#fade { position: absolute; inset: 0; background: #000; }

/* even line breaks for captions (no stranded last word) */
.title, .sub, .midTitle, .bigTitle, #privacy .tx1, #privacy .tx2 { text-wrap: balance; }

/* ---------- 16:9 layout */
html.wide, html.wide body, html.wide #stage { width: 1920px; height: 1080px; }
html.wide #grain { width: 1920px; height: 1080px; }
html.wide #capShade, html.wide #botShade { display: none; }
html.wide #bg { background: radial-gradient(75% 140% at 70% -15%, #6b0c12 0%, #33070a 42%, #120405 78%, #0b0203 100%); }
html.wide #vignette { background: radial-gradient(95% 120% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
html.wide .cue { left: 1010px; right: 110px; text-align: right; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
html.wide .title { font-size: 92px; }
html.wide .sub { font-size: 44px; }
html.wide #stepper { left: 1010px; width: 800px; top: 130px; }
html.wide #privacy { left: 1000px; right: 80px; bottom: 100px; padding: 20px 26px; }
html.wide #privacy .tx1 { font-size: 31px; }
html.wide #privacy .tx2 { font-size: 26px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="bgGlow"></div>
  <img class="sculpt" id="sc1" src="assets/sculpt1.png">
  <img class="sculpt" id="sc4" src="assets/sculpt4.png">
  <img class="sculpt" id="sc3" src="assets/sculpt3.png">
  <img class="sculpt" id="sc5" src="assets/sculpt5.png">
  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div id="vignette"></div>

  <!-- phone -->
  <div id="phone">
    <div id="bezel"></div>
    <div class="sidebtn" style="left:-17px;top:170px;height:60px"></div>
    <div class="sidebtn" style="right:-17px;top:150px;height:40px"></div>
    <div class="sidebtn" style="right:-17px;top:210px;height:80px"></div>
    <div id="screen">
      <div id="sbar"><span id="clock">9:41</span><span id="sicons"></span></div>
      <div id="punch"></div>
      <div id="vp">
        <div class="layer" id="LB"></div>
        <div class="layer" id="LA"></div>
        <div id="ovl">
          <div id="spot"></div>
          <div id="picker"><div class="card" id="pickerCard"></div></div>
          <div id="fs">
            <div id="fsTitle">پشتڕاستکردنەوەی ناسنامە</div>
            <div id="fsClose"></div>
            <div id="ring">
              <div id="brackets"><span></span><span></span><span></span><span></span></div>
              <div id="outer"></div>
              <div id="conic"></div>
              <div id="view">
                <div id="feed"></div>
                <div id="scanline"></div>
                <div id="prog"></div>
                <div id="loader"></div>
                <div id="flash"></div>
                <div id="okBadge"></div>
              </div>
              <div id="foundBadge">ڕووخسار دۆزرایەوە</div>
            </div>
            <div id="fsText"></div>
          </div>
          <div id="taps"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="capShade"></div>
  <div id="botShade"></div>
  <div id="stepper"></div>
  <div id="cues"></div>
  <div id="privacy">
    <div class="ic" id="privIc"></div>
    <div><div class="tx1">پشکنین تەنها لەسەر مۆبایلەکەی خۆت دەکرێت</div><div class="tx2">هیچ ڤیدیۆیەک نانێردرێت — تەنها وێنە کۆتاییەکە</div></div>
  </div>

  <div id="dive"></div>
  <div id="intro"></div>
  <div id="outro"></div>
  <div id="fade"></div>
</div>
<script src="cap/manifest.js"></script>
<script src="face.js"></script>
<script src="engine.js"></script>
</body>
</html>
